<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>भारत · BHARAT 3D — Satellite, Weather, Drone & Directions</title>
<meta name="description" content="A free hyperreal 3D exploration tool for India. Full-country satellite imagery, real terrain, live weather with wind & rain on the map, precise regional elevation, cinematic drone views, and turn-by-turn directions.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- MapLibre loaded by multi-CDN fallback loader at bottom of page -->

<style>
:root{
  --ink:#0B0E14;
  --panel:rgba(11,14,20,.84);
  --hairline:rgba(255,255,255,.09);
  --text:#ECE7DC;
  --text-dim:#9AA0AC;
  --saffron:#FF7A1A;
  --saffron-soft:rgba(255,122,26,.16);
  --green:#3ddc84;
  --blue:#6ab7ff;
  --radius:14px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text)}
#map{position:fixed;inset:0}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}

/* ---------- Wordmark ---------- */
.wordmark{
  position:fixed;top:14px;left:14px;z-index:20;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);border-radius:var(--radius);
  padding:10px 16px;box-shadow:var(--shadow);
  user-select:none;line-height:1.1;
}
.wordmark .deva{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:.5px}
.wordmark .deva::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--saffron);margin-left:8px;vertical-align:middle}
.wordmark .sub{font-size:10px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin-top:3px}

/* ---------- Search ---------- */
.search-wrap{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;
  width:min(520px,calc(100vw - 200px));
}
.search-box{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);border-radius:var(--radius);
  padding:0 14px;box-shadow:var(--shadow);
  transition:border-color .2s;
}
.search-box:focus-within{border-color:var(--saffron)}
.search-box svg{flex:none;opacity:.55}
.search-box input{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font:500 14px 'IBM Plex Sans',sans-serif;padding:12px 0;min-width:0;
}
.search-box input::placeholder{color:var(--text-dim)}
.search-hint{flex:none;font:400 10px 'IBM Plex Mono',monospace;color:var(--text-dim);border:1px solid var(--hairline);border-radius:5px;padding:2px 6px}
.results{
  margin-top:6px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);display:none;
}
.results.open{display:block}
.result{
  width:100%;text-align:left;background:none;border:none;cursor:pointer;
  padding:11px 14px;color:var(--text);font:500 13px 'IBM Plex Sans',sans-serif;
  border-bottom:1px solid var(--hairline);
}
.result:last-child{border-bottom:none}
.result:hover,.result:focus-visible{background:var(--saffron-soft);outline:none}
.result .type{display:block;font:400 10px 'IBM Plex Mono',monospace;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.result.note{cursor:default;color:var(--text-dim)}
.result.note:hover{background:none}

/* ---------- Control rail ---------- */
.rail{
  position:fixed;top:14px;right:14px;z-index:20;
  display:flex;flex-direction:column;gap:8px;
}
.ctl{
  width:42px;height:42px;border-radius:12px;cursor:pointer;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);box-shadow:var(--shadow);
  color:var(--text);display:flex;align-items:center;justify-content:center;
  font:600 10px 'IBM Plex Mono',monospace;
  transition:border-color .2s,color .2s;
}
.ctl:hover{border-color:rgba(255,255,255,.25)}
.ctl:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.ctl.active{border-color:var(--saffron);color:var(--saffron)}
.ctl svg{width:18px;height:18px}

/* ---------- City chips ---------- */
.cities{
  position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;
  display:flex;gap:8px;overflow-x:auto;padding:6px 14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.cities::-webkit-scrollbar{display:none}
.chip{
  flex:none;cursor:pointer;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);border-radius:999px;
  padding:9px 16px;color:var(--text);font:500 13px 'IBM Plex Sans',sans-serif;
  box-shadow:var(--shadow);transition:border-color .2s,color .2s;white-space:nowrap;
}
.chip:hover{border-color:rgba(255,255,255,.25)}
.chip:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.chip.active{border-color:var(--saffron);color:var(--saffron)}

/* ---------- HUD ---------- */
.hud{
  position:fixed;left:14px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;
  background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--hairline);border-radius:10px;
  padding:8px 12px;box-shadow:var(--shadow);
  font:500 11px 'IBM Plex Mono',monospace;color:var(--text-dim);
  display:flex;gap:14px;user-select:none;
}
.hud b{color:var(--text);font-weight:500}
.hud .lbl{color:var(--saffron);margin-right:5px}

/* ---------- Side panels (place info / directions) ---------- */
.panel{
  position:fixed;top:74px;left:14px;z-index:25;
  width:min(360px,calc(100vw - 28px));
  max-height:calc(100vh - 180px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--hairline);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px;display:none;
  scrollbar-width:thin;
}
.panel.open{display:block}
.panel h2{font-family:'Fraunces',serif;font-size:18px;font-weight:700;line-height:1.25;padding-right:28px}
.panel .sub{font:400 10px 'IBM Plex Mono',monospace;color:var(--text-dim);letter-spacing:1px;margin-top:3px;text-transform:uppercase}
.panel .close{
  position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;cursor:pointer;
  background:none;border:1px solid var(--hairline);color:var(--text-dim);font-size:13px;
}
.panel .close:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.now{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.now .t{font-family:'Fraunces',serif;font-size:42px;font-weight:700;line-height:1}
.now .d{font-size:13px;color:var(--text)}
.now .d small{display:block;color:var(--text-dim);font-size:11px;margin-top:2px}
.now .ico{font-size:34px;line-height:1}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wcell{border:1px solid var(--hairline);border-radius:10px;padding:9px 10px}
.wcell .k{font:400 9px 'IBM Plex Mono',monospace;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.2px}
.wcell .v{font-size:14px;font-weight:600;margin-top:3px}
.wcell .v small{font-weight:400;color:var(--text-dim);font-size:11px}
.windrose{display:inline-block;transition:transform .6s;color:var(--blue)}
.sect{font:600 10px 'IBM Plex Mono',monospace;color:var(--saffron);text-transform:uppercase;letter-spacing:2px;margin:16px 0 8px}
.elevbar{position:relative;height:10px;border-radius:5px;margin:10px 2px 4px;
  background:linear-gradient(90deg,#2d6a4f,#b08968,#e8e3d8)}
.elevbar .dot{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;
  background:var(--saffron);border:3px solid var(--ink);transform:translateX(-50%)}
.elevrow{display:flex;justify-content:space-between;font:500 11px 'IBM Plex Mono',monospace;color:var(--text-dim);margin-top:4px}
.elevrow b{color:var(--text)}
.panel .actions{display:flex;gap:8px;margin-top:16px}
.abtn{
  flex:1;cursor:pointer;border-radius:10px;padding:10px 6px;text-align:center;
  background:var(--saffron-soft);border:1px solid rgba(255,122,26,.35);color:var(--saffron);
  font:600 12px 'IBM Plex Sans',sans-serif;transition:background .2s;
}
.abtn:hover{background:rgba(255,122,26,.28)}
.abtn.ghost{background:none;border:1px solid var(--hairline);color:var(--text)}
.abtn.ghost:hover{border-color:rgba(255,255,255,.3)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--hairline);border-top-color:var(--saffron);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-note{color:var(--text-dim);font-size:12px;margin-top:12px}

/* ---------- Directions ---------- */
.dir-field{display:flex;align-items:center;gap:8px;margin-top:10px}
.dir-field .pin{flex:none;width:10px;height:10px;border-radius:50%}
.dir-field .pin.a{background:var(--green)}
.dir-field .pin.b{background:var(--saffron)}
.dir-field input{
  flex:1;background:rgba(255,255,255,.05);border:1px solid var(--hairline);border-radius:9px;
  color:var(--text);font:500 13px 'IBM Plex Sans',sans-serif;padding:9px 10px;outline:none;min-width:0;
}
.dir-field input:focus{border-color:var(--saffron)}
.dir-field .mini{
  flex:none;width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:none;border:1px solid var(--hairline);color:var(--text-dim);font-size:13px;
}
.dir-field .mini:hover{color:var(--text);border-color:rgba(255,255,255,.3)}
.dir-field .mini.picking{color:var(--saffron);border-color:var(--saffron)}
.dir-tools{display:flex;gap:8px;margin-top:10px}
.route-sum{display:flex;gap:14px;align-items:baseline;margin:14px 0 4px}
.route-sum .big{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--green)}
.route-sum .km{font:500 13px 'IBM Plex Mono',monospace;color:var(--text-dim)}
.steps{margin-top:8px;border-top:1px solid var(--hairline)}
.step{display:flex;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hairline);font-size:12.5px;line-height:1.45}
.step .ic{flex:none;width:20px;text-align:center;opacity:.8}
.step .dist{flex:none;font:400 10px 'IBM Plex Mono',monospace;color:var(--text-dim);align-self:center}
.step .tx{flex:1}

/* ---------- Drone / cinematic ---------- */
.cinebar{position:fixed;left:0;right:0;height:0;background:#000;z-index:45;transition:height 1.2s cubic-bezier(.7,0,.3,1)}
#cineTop{top:0}#cineBot{bottom:0}
body.cine #cineTop,body.cine #cineBot{height:9vh}
body.cine .wordmark,body.cine .search-wrap,body.cine .rail,body.cine .cities,body.cine .hud,body.cine .panel{display:none!important}
.cinehud{
  position:fixed;top:calc(9vh + 14px);left:18px;z-index:46;display:none;
  font:500 11px 'IBM Plex Mono',monospace;color:#fff;letter-spacing:2px;text-shadow:0 1px 4px rgba(0,0,0,.8);
  user-select:none;
}
body.cine .cinehud{display:block}
.cinehud .rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3b30;margin-right:8px;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.cineexit{
  position:fixed;top:calc(9vh + 10px);right:18px;z-index:46;display:none;cursor:pointer;
  background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);border-radius:999px;
  color:#fff;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:1.5px;padding:8px 16px;
}
body.cine .cineexit{display:block}
.cinetitle{
  position:fixed;bottom:calc(9vh + 24px);left:0;right:0;z-index:46;display:none;text-align:center;
  font-family:'Fraunces',serif;font-size:clamp(18px,3.4vw,30px);font-weight:500;color:#fff;
  letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.8);pointer-events:none;
}
body.cine .cinetitle{display:block}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));z-index:60;
  background:var(--panel);border:1px solid var(--hairline);border-radius:10px;
  padding:10px 16px;font:500 13px 'IBM Plex Sans',sans-serif;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.toast.show{opacity:1}

.maplibregl-ctrl-attrib{background:rgba(11,14,20,.6)!important;color:var(--text-dim)!important;font-size:10px!important}
.maplibregl-ctrl-attrib a{color:var(--text-dim)!important}

@media (max-width:640px){
  .search-wrap{top:72px;left:14px;right:14px;transform:none;width:auto}
  .search-hint{display:none}
  .hud{display:none}
  .panel{top:auto;bottom:calc(64px + env(safe-area-inset-bottom));left:10px;width:calc(100vw - 20px);max-height:48vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<div id="map"></div>
<canvas id="fx"></canvas>

<div class="wordmark" aria-hidden="true">
  <div class="deva">भारत</div>
  <div class="sub">Bharat 3D · Exploration</div>
</div>

<div class="search-wrap">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search any city, town, or village in India…" autocomplete="off" aria-label="Search locations in India">
    <span class="search-hint">ENTER</span>
  </div>
  <div class="results" id="results" role="listbox"></div>
</div>

<div class="rail">
  <button class="ctl active" id="btnSat" title="Toggle satellite imagery" aria-label="Toggle satellite imagery">SAT</button>
  <button class="ctl active" id="btn3d" title="Toggle 3D tilt" aria-label="Toggle 3D tilt">3D</button>
  <button class="ctl active" id="btnTerrain" title="Toggle terrain" aria-label="Toggle terrain elevation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20L9 8l4 7 3-4 5 9H3z"/></svg>
  </button>
  <button class="ctl" id="btnDrone" title="Drone view — cinematic flight over this spot" aria-label="Start drone view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="5" r="2.4"/><circle cx="19" cy="5" r="2.4"/><circle cx="5" cy="19" r="2.4"/><circle cx="19" cy="19" r="2.4"/><rect x="9.4" y="9.4" width="5.2" height="5.2" rx="1.4"/><path d="M7 7l2.6 2.6M17 7l-2.6 2.6M7 17l2.6-2.6M17 17l-2.6-2.6"/></svg>
  </button>
  <button class="ctl" id="btnDir" title="Directions" aria-label="Toggle directions panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 10-10 10L2 12z"/><path d="M9 13v-2.5a1.5 1.5 0 011.5-1.5H15M13 7l2.5 2-2.5 2"/></svg>
  </button>
  <button class="ctl active" id="btnFx" title="Toggle live weather effects (wind / rain)" aria-label="Toggle weather effects overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h11a3 3 0 100-3M3 13h15a3 3 0 110 3M3 18h8a2.5 2.5 0 11.5 2"/></svg>
  </button>
  <button class="ctl" id="btnNorth" title="Reset north" aria-label="Reset bearing to north">N</button>
  <button class="ctl" id="btnLocate" title="My location" aria-label="Fly to my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div class="cities" id="cities" role="toolbar" aria-label="Quick jump to major cities"></div>

<div class="hud" id="hud">
  <span><span class="lbl">LAT</span><b id="hLat">21.500</b></span>
  <span><span class="lbl">LNG</span><b id="hLng">78.960</b></span>
  <span><span class="lbl">Z</span><b id="hZ">4.3</b></span>
  <span><span class="lbl">PITCH</span><b id="hP">0°</b></span>
  <span><span class="lbl">ELEV</span><b id="hE">—</b></span>
</div>

<!-- Place info panel -->
<aside class="panel" id="infoPanel" aria-label="Place information">
  <button class="close" id="infoClose" aria-label="Close place information">✕</button>
  <h2 id="ipName">—</h2>
  <div class="sub" id="ipCoords">—</div>
  <div id="ipBody"><div class="loading-note"><span class="spin"></span>&nbsp; Fetching live weather &amp; mapping the terrain…</div></div>
</aside>

<!-- Directions panel -->
<aside class="panel" id="dirPanel" aria-label="Directions">
  <button class="close" id="dirClose" aria-label="Close directions">✕</button>
  <h2>Directions</h2>
  <div class="sub">Door-to-door routing · OSRM engine</div>
  <div class="dir-field">
    <span class="pin a"></span>
    <input id="dirFrom" type="text" placeholder="From — place, village, or address" autocomplete="off">
    <button class="mini" id="pickFrom" title="Pick start on the map">⌖</button>
  </div>
  <div class="dir-field">
    <span class="pin b"></span>
    <input id="dirTo" type="text" placeholder="To — destination" autocomplete="off">
    <button class="mini" id="pickTo" title="Pick destination on the map">⌖</button>
  </div>
  <div class="dir-tools">
    <button class="abtn ghost" id="dirMyLoc">⌾ My location</button>
    <button class="abtn ghost" id="dirSwap">⇅ Swap</button>
    <button class="abtn" id="dirGo">Route →</button>
  </div>
  <div id="dirOut"></div>
</aside>

<!-- Drone cinematic chrome -->
<div class="cinebar" id="cineTop"></div>
<div class="cinebar" id="cineBot"></div>
<div class="cinehud"><span class="rec"></span>DRONE · 4K · <span id="cineAlt">—</span></div>
<button class="cineexit" id="cineExit">EXIT ✕</button>
<div class="cinetitle" id="cineTitle"></div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ---------- On-screen error reporter (no DevTools needed) ---------- */
window.addEventListener('error', function (e) {
  try {
    var box = document.getElementById('errbox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errbox';
      box.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;background:#2a0f0f;color:#ffd7d7;border:1px solid #a33;border-radius:10px;padding:10px 36px 10px 12px;font:12px monospace;max-height:30vh;overflow:auto;word-break:break-word';
      var x = document.createElement('button');
      x.textContent = '✕';
      x.style.cssText = 'position:absolute;top:6px;right:8px;background:none;border:none;color:#ffd7d7;font-size:14px;cursor:pointer';
      x.onclick = function () { box.remove(); };
      box.appendChild(x);
      document.body.appendChild(box);
    }
    var line = document.createElement('div');
    line.textContent = '› ' + (e.message || 'unknown error') + (e.filename ? '  [' + e.filename.split('/').pop() + ':' + e.lineno + ']' : '');
    box.appendChild(line);
  } catch (ignore) {}
});


/* ---------- Multi-CDN loader: jsDelivr -> unpkg -> cdnjs ---------- */
var MAPLIBRE_CDNS = [
  'https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl',
  'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl',
  'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl'
];
function loadMapLibre(i) {
  if (i >= MAPLIBRE_CDNS.length) {
    document.body.insertAdjacentHTML('beforeend',
      '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99;background:#0B0E14;color:#ECE7DC;font-family:sans-serif;text-align:center;padding:24px">' +
      '<div><div style="font-size:18px;margin-bottom:8px">Map engine could not load</div>' +
      '<div style="color:#9AA0AC;font-size:14px">Check your internet connection, then reload the page.</div></div></div>');
    return;
  }
  var base = MAPLIBRE_CDNS[i];
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = base + '.css';
  document.head.appendChild(css);
  var s = document.createElement('script');
  s.src = base + '.js';
  s.onload = function () {
    if (window.maplibregl) { initApp(); }
    else { loadMapLibre(i + 1); }
  };
  s.onerror = function () { loadMapLibre(i + 1); };
  document.head.appendChild(s);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { loadMapLibre(0); });
} else {
  loadMapLibre(0);
}

function initApp() {

/* ---------- Sandbox detection: MapLibre needs Web Workers ---------- */
try {
  var probe = new Worker(URL.createObjectURL(new Blob([''], { type: 'text/javascript' })));
  probe.terminate();
} catch (workerErr) {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99;background:#0B0E14;color:#ECE7DC;font-family:sans-serif;text-align:center;padding:24px;line-height:1.6">' +
    '<div style="max-width:420px"><div style="font-family:serif;font-size:28px;margin-bottom:10px">भारत <span style="color:#FF7A1A">●</span></div>' +
    '<div style="font-size:16px;margin-bottom:10px">This preview sandbox blocks the map engine.</div>' +
    '<div style="color:#9AA0AC;font-size:14px">Deploy this file to GitHub Pages and open the live URL — it will work there. Preview panes (Claude, code editors) block the Web Workers that 3D maps require.</div></div></div>');
  return;
}


/* =====================================================
   BHARAT 3D — single-file India exploration tool
   Base map : OpenFreeMap (keyless vector)
   Satellite: Esri World Imagery (keyless raster, full country)
   Terrain  : AWS Terrarium DEM
   Weather  : Open-Meteo (keyless) · Elevation: Open-Meteo grid sampling
   Routing  : OSRM demo server · Geocoding: Nominatim (OSM)
   Renderer : MapLibre GL JS
   ===================================================== */

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const INDIA_CENTER = [78.96, 21.5];
const INDIA_BOUNDS = [[55, 2], [105, 40]]; // loose box: keeps you in the neighbourhood

let map;
try {
map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: INDIA_CENTER,
  zoom: 4.2,
  pitch: 0,
  bearing: 0,
  maxBounds: INDIA_BOUNDS,
  maxPitch: 85,
  attributionControl: { compact: true },
  // Smoothness over raw pixels: MSAA off, retina capped at 2x, no label
  // fade-in re-renders, and a big tile cache so camera moves replay from memory
  antialias: false,
  pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  fadeDuration: 0,
  maxTileCacheSize: 2048
});

} catch (err) {
  throw new Error('Map init failed: ' + err.message);
}
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
try { map.touchPitch.enable(); } catch (e) { /* not critical */ }

/* ---------- Terrain + satellite + hillshade + sky + buildings ---------- */
let terrainOn = true;
let satOn = true;

function firstSymbolId() {
  try {
    const l = map.getStyle().layers.find(function (x) { return x.type === 'symbol'; });
    return l ? l.id : undefined;
  } catch (e) { return undefined; }
}

map.on('load', () => {
  // Real elevation: AWS open terrain tiles (terrarium encoding, no key)
  map.addSource('dem', {
    type: 'raster-dem',
    encoding: 'terrarium',
    tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
    tileSize: 256,
    maxzoom: 14
  });
  map.setTerrain({ source: 'dem', exaggeration: 1.35 });

  // Hillshade gives the Himalaya / Ghats their drama in streets mode
  try {
    map.addLayer({
      id: 'hillshade', type: 'hillshade', source: 'dem',
      paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#0B0E14' },
      // satellite covers it by default — skip the render pass until needed
      layout: { visibility: satOn ? 'none' : 'visible' }
    }, firstSymbolId());
  } catch (e) { console.warn('hillshade skipped', e); }

  // Full-country satellite imagery (Esri World Imagery, keyless).
  // Drapes over the 3D terrain; labels stay on top = hybrid hyperreal view.
  try {
    map.addSource('sat', {
      type: 'raster',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
      tileSize: 256,
      maxzoom: 19,
      attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
    });
    map.addLayer({
      id: 'sat-layer', type: 'raster', source: 'sat',
      paint: { 'raster-fade-duration': 0, 'raster-saturation': 0.12, 'raster-contrast': 0.06 },
      layout: { visibility: 'visible' }
    }, firstSymbolId());
  } catch (e) { console.warn('satellite skipped', e); }

  // Daylight atmosphere — haze on the horizon sells the realism at a tilt
  try {
    map.setSky({
      'sky-color': '#7fb2e5',
      'horizon-color': '#e8d8b4',
      'fog-color': '#cfd6dd',
      'sky-horizon-blend': 0.7,
      'horizon-fog-blend': 0.55
    });
  } catch (e) { /* older maplibre: fine without sky */ }

  // 3D buildings — only add our own if the style doesn't already extrude
  try {
    const style = map.getStyle();
    const hasExtrusion = style.layers.some(l => l.type === 'fill-extrusion');
    if (!hasExtrusion) {
      const vecSrc = Object.keys(style.sources).find(k => style.sources[k].type === 'vector');
      if (vecSrc) {
        map.addLayer({
          id: 'bharat-3d-buildings',
          source: vecSrc,
          'source-layer': 'building',
          type: 'fill-extrusion',
          minzoom: 14.5,
          paint: {
            'fill-extrusion-color': [
              'interpolate', ['linear'],
              ['coalesce', ['get', 'render_height'], 8],
              0, '#2e3340', 60, '#4a4336', 150, '#6b5226'
            ],
            'fill-extrusion-height': [
              'interpolate', ['linear'], ['zoom'],
              14.5, 0, 16, ['coalesce', ['get', 'render_height'], 8]
            ],
            'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
            'fill-extrusion-opacity': 0.88
          }
        });
      }
    }
  } catch (e) { console.warn('buildings skipped', e); }

  // Gentle opening move
  if (!REDUCED) {
    map.easeTo({ pitch: 35, zoom: 4.5, duration: 2400, essential: false });
  }
});

/* ---------- Camera helper ---------- */
function flyTo(lng, lat, zoom = 14.5, pitch = 55, bearing = -15) {
  const opts = { center: [lng, lat], zoom, pitch, bearing };
  if (REDUCED) { map.jumpTo(opts); }
  else { map.flyTo({ ...opts, duration: 3200, curve: 1.6, essential: true }); }
}

/* ---------- Current place state ---------- */
let place = null; // { name, lat, lng }
let placeMarker = null;

function setPlace(name, lat, lng) {
  place = { name: name, lat: lat, lng: lng };
  if (placeMarker) placeMarker.remove();
  placeMarker = new maplibregl.Marker({ color: '#FF7A1A' }).setLngLat([lng, lat]).addTo(map);
  loadPlaceInfo(place);
}

/* ---------- Search: Nominatim (any village in India) ---------- */
const input = document.getElementById('search');
const resultsEl = document.getElementById('results');
let debounce, lastQuery = '';

input.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = input.value.trim();
  if (q.length < 3) { closeResults(); return; }
  debounce = setTimeout(() => geocode(q), 450); // polite to Nominatim
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(debounce); geocode(input.value.trim()); }
  if (e.key === 'Escape') closeResults();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeResults();
});

async function geocode(q) {
  if (!q || q === lastQuery) return;
  lastQuery = q;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=in&limit=6&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    renderResults(data);
  } catch (err) {
    renderResults(null);
  }
}

function renderResults(data) {
  resultsEl.innerHTML = '';
  if (!data) {
    resultsEl.innerHTML = '<div class="result note">Search unavailable — check connection.</div>';
  } else if (!data.length) {
    resultsEl.innerHTML = '<div class="result note">No match in India. Try adding the district or state.</div>';
  } else {
    data.forEach(r => {
      const b = document.createElement('button');
      b.className = 'result';
      b.setAttribute('role', 'option');
      const name = r.display_name.split(',').slice(0, 3).join(',');
      b.innerHTML = escapeHtml(name) + '<span class="type">' + escapeHtml(r.type || r.class || 'place') + '</span>';
      b.addEventListener('click', () => {
        closeResults();
        input.value = name;
        const zoomFor = { city: 13.5, town: 14.5, village: 15.5, hamlet: 16, suburb: 15, neighbourhood: 15.5 };
        flyTo(+r.lon, +r.lat, (zoomFor[r.type] !== undefined ? zoomFor[r.type] : 14.5));
        document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        setPlace(name.split(',')[0], +r.lat, +r.lon);
      });
      resultsEl.appendChild(b);
    });
  }
  resultsEl.classList.add('open');
}
function closeResults() { resultsEl.classList.remove('open'); lastQuery = ''; }
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* =====================================================
   PLACE INTELLIGENCE — live weather + precise regional
   elevation (grid-sampled high/low, not a single value)
   ===================================================== */
const infoPanel = document.getElementById('infoPanel');
const ipName = document.getElementById('ipName');
const ipCoords = document.getElementById('ipCoords');
const ipBody = document.getElementById('ipBody');
document.getElementById('infoClose').addEventListener('click', () => {
  infoPanel.classList.remove('open');
  fxSet({ wind: 0, rain: 0 });
});

const WMO = {
  0:['Clear sky','☀️'],1:['Mainly clear','🌤️'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],
  45:['Fog','🌫️'],48:['Rime fog','🌫️'],
  51:['Light drizzle','🌦️'],53:['Drizzle','🌦️'],55:['Heavy drizzle','🌧️'],
  56:['Freezing drizzle','🌧️'],57:['Freezing drizzle','🌧️'],
  61:['Light rain','🌧️'],63:['Rain','🌧️'],65:['Heavy rain','🌧️'],
  66:['Freezing rain','🌧️'],67:['Freezing rain','🌧️'],
  71:['Light snow','🌨️'],73:['Snow','🌨️'],75:['Heavy snow','❄️'],77:['Snow grains','❄️'],
  80:['Light showers','🌦️'],81:['Showers','🌧️'],82:['Violent showers','⛈️'],
  85:['Snow showers','🌨️'],86:['Snow showers','🌨️'],
  95:['Thunderstorm','⛈️'],96:['Thunderstorm + hail','⛈️'],99:['Thunderstorm + hail','⛈️']
};
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function compass(deg) { return COMPASS[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16]; }

let infoSeq = 0;
async function loadPlaceInfo(p) {
  const seq = ++infoSeq;
  ipName.textContent = p.name;
  ipCoords.textContent = p.lat.toFixed(4) + '° N · ' + p.lng.toFixed(4) + '° E';
  ipBody.innerHTML = '<div class="loading-note"><span class="spin"></span>&nbsp; Fetching live weather &amp; mapping the terrain…</div>';
  dirPanel.classList.remove('open');
  document.getElementById('btnDir').classList.remove('active');
  infoPanel.classList.add('open');

  const [wx, elev] = await Promise.all([fetchWeather(p), fetchElevationProfile(p)]);
  if (seq !== infoSeq) return; // a newer search superseded this one
  renderPlaceInfo(p, wx, elev);
}

async function fetchWeather(p) {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lng +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
      '&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max' +
      '&timezone=auto&forecast_days=1';
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather http ' + res.status);
    const d = await res.json();
    // probability for the current hour
    let probNow = null;
    if (d.hourly && d.hourly.time && d.current && d.current.time) {
      const hourKey = d.current.time.slice(0, 13);
      const idx = d.hourly.time.findIndex(t => t.slice(0, 13) === hourKey);
      if (idx >= 0) probNow = d.hourly.precipitation_probability[idx];
    }
    return { current: d.current, daily: d.daily, probNow: probNow };
  } catch (e) {
    console.warn('weather failed', e);
    return null;
  }
}

/* Grid-sample a ~22 km box around the place (10×10 = 100 points through
   the Open-Meteo elevation API, Copernicus DEM) → true local high & low. */
async function fetchElevationProfile(p) {
  try {
    const N = 10, span = 0.1; // ±0.1° ≈ ±11 km
    const lats = [], lngs = [];
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        lats.push((p.lat - span + (2 * span) * i / (N - 1)).toFixed(4));
        lngs.push((p.lng - span + (2 * span) * j / (N - 1)).toFixed(4));
      }
    }
    const url = 'https://api.open-meteo.com/v1/elevation?latitude=' + lats.join(',') + '&longitude=' + lngs.join(',');
    const res = await fetch(url);
    if (!res.ok) throw new Error('elevation http ' + res.status);
    const d = await res.json();
    const e = d.elevation;
    if (!e || !e.length) throw new Error('no elevation data');
    let min = Infinity, max = -Infinity, minI = 0, maxI = 0;
    for (let k = 0; k < e.length; k++) {
      if (e[k] < min) { min = e[k]; minI = k; }
      if (e[k] > max) { max = e[k]; maxI = k; }
    }
    // centre point = middle of the grid
    const centerIdx = Math.floor(N / 2) * N + Math.floor(N / 2);
    return {
      point: e[centerIdx],
      min: min, max: max,
      minAt: [+lngs[minI], +lats[minI]],
      maxAt: [+lngs[maxI], +lats[maxI]]
    };
  } catch (e) {
    console.warn('elevation failed', e);
    return null;
  }
}

function renderPlaceInfo(p, wx, elev) {
  let html = '';

  if (wx && wx.current) {
    const c = wx.current;
    const code = WMO[c.weather_code] || ['—', '🌡️'];
    const windFrom = c.wind_direction_10m;
    const windTo = (windFrom + 180) % 360;
    const prob = (wx.probNow !== null && wx.probNow !== undefined) ? wx.probNow
               : (wx.daily && wx.daily.precipitation_probability_max ? wx.daily.precipitation_probability_max[0] : null);

    html += '<div class="now">' +
      '<div class="ico">' + code[1] + '</div>' +
      '<div class="t">' + Math.round(c.temperature_2m) + '°</div>' +
      '<div class="d">' + code[0] + '<small>Feels like ' + Math.round(c.apparent_temperature) + '°C · ' +
        (wx.daily ? ('H ' + Math.round(wx.daily.temperature_2m_max[0]) + '° / L ' + Math.round(wx.daily.temperature_2m_min[0]) + '°') : '') +
      '</small></div></div>';

    html += '<div class="wgrid">' +
      '<div class="wcell"><div class="k">Humidity</div><div class="v">' + c.relative_humidity_2m + '<small> %</small></div></div>' +
      '<div class="wcell"><div class="k">Rain chance</div><div class="v">' + (prob !== null ? prob + '<small> %</small>' : '—') +
        (c.precipitation > 0 ? '<small> · ' + c.precipitation + ' mm now</small>' : '') + '</div></div>' +
      '<div class="wcell"><div class="k">Wind</div><div class="v"><span class="windrose" style="transform:rotate(' + windTo + 'deg)">↑</span> ' +
        Math.round(c.wind_speed_10m) + '<small> km/h from ' + compass(windFrom) + '</small></div></div>' +
      '<div class="wcell"><div class="k">Gusts</div><div class="v">' + Math.round(c.wind_gusts_10m) + '<small> km/h</small></div></div>' +
      '<div class="wcell"><div class="k">Cloud cover</div><div class="v">' + c.cloud_cover + '<small> %</small></div></div>' +
      '<div class="wcell"><div class="k">UV index</div><div class="v">' + (wx.daily && wx.daily.uv_index_max ? Math.round(wx.daily.uv_index_max[0]) : '—') + '</div></div>' +
      '</div>';

    // Drive the on-map effects: animated wind streaks + rain when it's wet
    const raining = c.precipitation > 0 || (c.weather_code >= 51 && c.weather_code <= 99) || (prob !== null && prob >= 60);
    fxSet({
      wind: c.wind_speed_10m,
      windFrom: windFrom,
      rain: raining ? Math.min(1, Math.max(0.25, c.precipitation / 4 || (prob || 60) / 100)) : 0
    });
  } else {
    html += '<div class="loading-note">Live weather unavailable right now — check connection.</div>';
    fxSet({ wind: 0, rain: 0 });
  }

  html += '<div class="sect">Terrain · sampled across ~22 km</div>';
  if (elev) {
    const range = Math.max(1, elev.max - elev.min);
    const pct = Math.min(100, Math.max(0, ((elev.point - elev.min) / range) * 100));
    html += '<div class="elevbar"><div class="dot" style="left:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="elevrow"><span>LOW <b>' + Math.round(elev.min) + ' m</b></span>' +
      '<span>HERE <b>' + Math.round(elev.point) + ' m</b></span>' +
      '<span>HIGH <b>' + Math.round(elev.max) + ' m</b></span></div>' +
      '<div class="elevrow" style="margin-top:6px"><span>Relief in this region</span><b>' + Math.round(elev.max - elev.min) + ' m</b></div>';
  } else {
    html += '<div class="loading-note">Elevation service unavailable right now.</div>';
  }

  html += '<div class="actions">' +
    '<button class="abtn" id="ipDrone">🎬 Drone view</button>' +
    '<button class="abtn ghost" id="ipDirections">→ Directions here</button>' +
    '</div>';

  ipBody.innerHTML = html;
  const droneBtn = document.getElementById('ipDrone');
  if (droneBtn) droneBtn.addEventListener('click', () => startDrone(p));
  const dirBtn = document.getElementById('ipDirections');
  if (dirBtn) dirBtn.addEventListener('click', () => {
    openDirections();
    dirToInput.value = p.name;
    dirState.to = { lat: p.lat, lng: p.lng, name: p.name };
    toast('Destination set — add a starting point');
  });
}

/* =====================================================
   WEATHER FX — wind streaks & rain rendered over the map,
   oriented to the real wind direction and the map bearing
   ===================================================== */
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const FX_DPR = Math.min(window.devicePixelRatio || 1, 1.5); // overlay never needs retina
let fx = { wind: 0, windFrom: 0, rain: 0, on: true };
let fxParticles = [], fxDrops = [], fxRAF = null;

function fxResize() {
  fxCanvas.width = window.innerWidth * FX_DPR;
  fxCanvas.height = window.innerHeight * FX_DPR;
  fxCanvas.style.width = window.innerWidth + 'px';
  fxCanvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', fxResize);
fxResize();

function fxSet(opts) {
  if (opts.wind !== undefined) fx.wind = opts.wind;
  if (opts.windFrom !== undefined) fx.windFrom = opts.windFrom;
  if (opts.rain !== undefined) fx.rain = opts.rain;
  fxSeed();
  fxLoopState();
}

function fxSeed() {
  const W = fxCanvas.width, H = fxCanvas.height;
  const windCount = (fx.wind > 3) ? Math.min(110, 30 + Math.round(fx.wind * 2.5)) : 0;
  fxParticles = [];
  for (let i = 0; i < windCount; i++) {
    fxParticles.push({ x: Math.random() * W, y: Math.random() * H, life: Math.random() });
  }
  const dropCount = fx.rain > 0 ? Math.round(90 + fx.rain * 200) : 0;
  fxDrops = [];
  for (let i = 0; i < dropCount; i++) {
    fxDrops.push({ x: Math.random() * W, y: Math.random() * H, v: 0.6 + Math.random() * 0.8 });
  }
}

function fxLoopState() {
  // droneActive: the camera gets the whole frame budget while filming
  const need = fx.on && !REDUCED && !droneActive && (fxParticles.length || fxDrops.length);
  if (need && !fxRAF) fxRAF = requestAnimationFrame(fxFrame);
  if (!need && fxRAF) { cancelAnimationFrame(fxRAF); fxRAF = null; fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
}

function fxFrame() {
  fxRAF = null;
  const W = fxCanvas.width, H = fxCanvas.height, dpr = FX_DPR;
  fxCtx.clearRect(0, 0, W, H);

  // direction the wind blows TOWARD, rotated with the map bearing → screen angle
  const toward = (fx.windFrom + 180) % 360;
  const screenDeg = toward - map.getBearing();
  const rad = screenDeg * Math.PI / 180;
  const ux = Math.sin(rad), uy = -Math.cos(rad);
  const spd = Math.max(0.5, fx.wind) * 0.09 * dpr;

  if (fxParticles.length) {
    fxCtx.lineWidth = 1.1 * dpr;
    for (const pt of fxParticles) {
      pt.x += ux * spd * 6; pt.y += uy * spd * 6;
      pt.life += 0.012;
      if (pt.life > 1 || pt.x < -60 || pt.x > W + 60 || pt.y < -60 || pt.y > H + 60) {
        pt.x = Math.random() * W; pt.y = Math.random() * H; pt.life = 0;
      }
      const a = Math.sin(pt.life * Math.PI) * 0.4;
      const len = (8 + fx.wind * 0.9) * dpr;
      fxCtx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
      fxCtx.beginPath();
      fxCtx.moveTo(pt.x, pt.y);
      fxCtx.lineTo(pt.x - ux * len, pt.y - uy * len);
      fxCtx.stroke();
    }
  }

  if (fxDrops.length) {
    fxCtx.lineWidth = 1.3 * dpr;
    fxCtx.strokeStyle = 'rgba(150,185,255,0.45)';
    const slant = ux * spd * 2.2;
    const fall = (10 + fx.rain * 14) * dpr;
    for (const d of fxDrops) {
      d.x += slant * d.v; d.y += fall * d.v * 0.55;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * W; }
      if (d.x > W + 20) d.x = -20; else if (d.x < -20) d.x = W + 20;
      fxCtx.beginPath();
      fxCtx.moveTo(d.x, d.y);
      fxCtx.lineTo(d.x + slant * 1.6, d.y + fall * 0.8);
      fxCtx.stroke();
    }
  }

  fxRAF = requestAnimationFrame(fxFrame);
}

const btnFx = document.getElementById('btnFx');
btnFx.addEventListener('click', () => {
  fx.on = !fx.on;
  btnFx.classList.toggle('active', fx.on);
  fxLoopState();
  toast(fx.on ? 'Weather effects on' : 'Weather effects off');
});

/* =====================================================
   DRONE VIEW — cinematic orbit flight over a location
   ===================================================== */
let droneRAF = null;
let droneActive = false;
let dronePrevPixelRatio = null;

function startDrone(target) {
  if (droneActive) return;
  const t = target || place || { name: 'India', lat: map.getCenter().lat, lng: map.getCenter().lng };
  droneActive = true;
  document.body.classList.add('cine');
  closeResults();
  fxLoopState(); // pause weather particles — the camera gets the whole frame budget

  // Film at a capped resolution: steady frame pacing reads smoother than pixels
  try {
    if (map.getPixelRatio && map.setPixelRatio) {
      dronePrevPixelRatio = map.getPixelRatio();
      map.setPixelRatio(Math.min(dronePrevPixelRatio, 1.25));
    }
  } catch (e) { dronePrevPixelRatio = null; }

  const ORBIT_ZOOM = 15.1, ORBIT_PITCH = 62;
  const cineTitle = document.getElementById('cineTitle');

  if (REDUCED) {
    // Respect reduced motion: a static high shot instead of the flight
    cineTitle.textContent = t.name || '';
    map.jumpTo({ center: [t.lng, t.lat], zoom: ORBIT_ZOOM, pitch: 60, bearing: 30 });
    return;
  }

  // Phase 0 — glide to the start mark, then HOLD until every tile in view has
  // loaded ('idle'). Starting the orbit on a warm cache is what kills stutter.
  cineTitle.textContent = 'Establishing uplink…';
  const startBearing = map.getBearing();
  map.flyTo({ center: [t.lng, t.lat], zoom: ORBIT_ZOOM, pitch: ORBIT_PITCH, bearing: startBearing, duration: 2800, essential: true });

  let started = false;
  function begin() {
    if (started || !droneActive) { map.off('idle', begin); return; }
    started = true;
    map.off('idle', begin);
    cineTitle.textContent = t.name || '';
    try {
      const el = map.queryTerrainElevation([t.lng, t.lat]);
      document.getElementById('cineAlt').textContent =
        (el !== null && el !== undefined ? Math.round(el) + ' M ASL' : '—');
    } catch (e) { /* terrain may be off */ }
    orbit();
  }
  map.on('idle', begin);
  setTimeout(begin, 7000); // slow network failsafe — roll anyway

  function orbit() {
    const DUR = 50000;
    const t0 = performance.now();
    const ease = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

    function frame(now) {
      if (!droneActive) return;
      const u = Math.min(1, (now - t0) / DUR);

      let zoom, pitch, bearing;
      if (u < 0.9) {
        // One slow, constant-speed revolution. Zoom stays LOCKED so the
        // renderer never swaps tile detail mid-shot; pitch breathes gently
        // and the second half of the circle replays tiles already cached.
        const k = u / 0.9;
        bearing = startBearing + k * 360;
        pitch = ORBIT_PITCH + Math.sin(k * Math.PI * 2) * 4;
        zoom = ORBIT_ZOOM;
      } else {
        // The reveal — pull up and away. Zooming OUT only ever needs
        // lower-detail tiles, which are already in memory from the approach.
        const k = ease((u - 0.9) / 0.1);
        bearing = startBearing + 360 + k * 18;
        pitch = ORBIT_PITCH - k * 22;
        zoom = ORBIT_ZOOM - k * 2.2;
      }

      map.jumpTo({ center: [t.lng, t.lat], zoom: zoom, pitch: pitch, bearing: bearing });

      if (u < 1) { droneRAF = requestAnimationFrame(frame); }
      else { stopDrone(); }
    }
    droneRAF = requestAnimationFrame(frame);
  }
}

function stopDrone() {
  if (!droneActive) return;
  droneActive = false;
  if (droneRAF !== null) { cancelAnimationFrame(droneRAF); droneRAF = null; }
  try { map.stop(); } catch (e) { /* nothing in flight */ }
  try {
    if (dronePrevPixelRatio !== null && map.setPixelRatio) map.setPixelRatio(dronePrevPixelRatio);
  } catch (e) { /* keep current ratio */ }
  dronePrevPixelRatio = null;
  document.body.classList.remove('cine');
  fxLoopState(); // resume weather particles
}

document.getElementById('btnDrone').addEventListener('click', () => {
  if (droneActive) { stopDrone(); return; }
  if (!place) { toast('Search a place first — then launch the drone'); return; }
  startDrone(place);
});
document.getElementById('cineExit').addEventListener('click', stopDrone);
document.addEventListener('keydown', e => { if (e.key === 'Escape') stopDrone(); });
map.on('mousedown', () => { if (droneActive && !REDUCED) stopDrone(); });
map.on('touchstart', () => { if (droneActive && !REDUCED) stopDrone(); });

/* =====================================================
   DIRECTIONS — Nominatim geocoding + OSRM routing,
   with pick-on-map for both ends and turn-by-turn steps
   ===================================================== */
const dirPanel = document.getElementById('dirPanel');
const dirFromInput = document.getElementById('dirFrom');
const dirToInput = document.getElementById('dirTo');
const dirOut = document.getElementById('dirOut');
const dirState = { from: null, to: null, markers: [], pick: null };

function openDirections() {
  infoPanel.classList.remove('open');
  dirPanel.classList.add('open');
  document.getElementById('btnDir').classList.add('active');
}
function closeDirections() {
  dirPanel.classList.remove('open');
  document.getElementById('btnDir').classList.remove('active');
  dirState.pick = null;
  document.getElementById('pickFrom').classList.remove('picking');
  document.getElementById('pickTo').classList.remove('picking');
}
document.getElementById('btnDir').addEventListener('click', () => {
  dirPanel.classList.contains('open') ? closeDirections() : openDirections();
});
document.getElementById('dirClose').addEventListener('click', closeDirections);

document.getElementById('dirSwap').addEventListener('click', () => {
  const v = dirFromInput.value; dirFromInput.value = dirToInput.value; dirToInput.value = v;
  const s = dirState.from; dirState.from = dirState.to; dirState.to = s;
});

document.getElementById('dirMyLoc').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
  toast('Locating…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      dirState.from = { lat: pos.coords.latitude, lng: pos.coords.longitude, name: 'My location' };
      dirFromInput.value = 'My location';
      toast('Start set to your location');
    },
    () => toast('Location permission denied'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

function armPick(which) {
  dirState.pick = (dirState.pick === which) ? null : which;
  document.getElementById('pickFrom').classList.toggle('picking', dirState.pick === 'from');
  document.getElementById('pickTo').classList.toggle('picking', dirState.pick === 'to');
  if (dirState.pick) toast('Tap the map to drop the ' + (which === 'from' ? 'start' : 'destination') + ' pin');
}
document.getElementById('pickFrom').addEventListener('click', () => armPick('from'));
document.getElementById('pickTo').addEventListener('click', () => armPick('to'));

map.on('click', e => {
  if (!dirState.pick) return;
  const label = e.lngLat.lat.toFixed(4) + ', ' + e.lngLat.lng.toFixed(4);
  const pt = { lat: e.lngLat.lat, lng: e.lngLat.lng, name: 'Pin (' + label + ')' };
  if (dirState.pick === 'from') { dirState.from = pt; dirFromInput.value = pt.name; }
  else { dirState.to = pt; dirToInput.value = pt.name; }
  dirState.pick = null;
  document.getElementById('pickFrom').classList.remove('picking');
  document.getElementById('pickTo').classList.remove('picking');
});

// typing invalidates a previously resolved point
dirFromInput.addEventListener('input', () => { dirState.from = null; });
dirToInput.addEventListener('input', () => { dirState.to = null; });
dirFromInput.addEventListener('keydown', e => { if (e.key === 'Enter') routeNow(); });
dirToInput.addEventListener('keydown', e => { if (e.key === 'Enter') routeNow(); });
document.getElementById('dirGo').addEventListener('click', routeNow);

async function geocodeOne(q) {
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=in&limit=1&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  const data = await res.json();
  if (!data || !data.length) return null;
  return { lat: +data[0].lat, lng: +data[0].lon, name: data[0].display_name.split(',').slice(0, 2).join(',') };
}

const MANEUVER_ICONS = {
  'turn-left': '↰', 'turn-right': '↱', 'turn-sharp left': '⬑', 'turn-sharp right': '⬏',
  'turn-slight left': '↖', 'turn-slight right': '↗', 'turn-straight': '↑', 'turn-uturn': '↩',
  'depart': '🚩', 'arrive': '🏁', 'merge': '⇗', 'fork': 'Ⅴ',
  'roundabout': '↻', 'rotary': '↻', 'on ramp': '⇗', 'off ramp': '⇘',
  'end of road-left': '↰', 'end of road-right': '↱', 'continue': '↑', 'new name': '↑'
};
function stepIcon(s) {
  const m = s.maneuver || {};
  return MANEUVER_ICONS[m.type + '-' + (m.modifier || '')] ||
         MANEUVER_ICONS[(m.type || '') + ' ' + (m.modifier || '')] ||
         MANEUVER_ICONS['turn-' + (m.modifier || '')] ||
         MANEUVER_ICONS[m.type] || '•';
}
function stepText(s) {
  const m = s.maneuver || {};
  const road = s.name ? ' onto <b>' + escapeHtml(s.name) + '</b>' : '';
  switch (m.type) {
    case 'depart': return 'Head ' + (m.modifier || 'out') + (s.name ? ' on <b>' + escapeHtml(s.name) + '</b>' : '');
    case 'arrive': return '<b>Arrive at your destination</b>' + (m.modifier ? ' (on the ' + m.modifier + ')' : '');
    case 'roundabout': case 'rotary':
      return 'At the roundabout, take exit ' + (m.exit || '') + road;
    case 'merge': return 'Merge ' + (m.modifier || '') + road;
    case 'on ramp': return 'Take the ramp ' + (m.modifier || '') + road;
    case 'off ramp': return 'Take the exit ' + (m.modifier || '') + road;
    case 'fork': return 'Keep ' + (m.modifier || 'ahead') + ' at the fork' + road;
    case 'end of road': return 'At the end of the road, turn ' + (m.modifier || '') + road;
    case 'continue': case 'new name': return 'Continue ' + (m.modifier && m.modifier !== 'straight' ? m.modifier : 'straight') + (s.name ? ' on <b>' + escapeHtml(s.name) + '</b>' : '');
    default:
      return (m.type === 'turn' ? 'Turn ' + (m.modifier || '') : (m.type || 'Continue') + ' ' + (m.modifier || '')) + road;
  }
}
function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1) + ' km' : Math.round(m) + ' m';
}
function fmtDur(s) {
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? h + ' hr ' + m + ' min' : m + ' min';
}

function clearRoute() {
  ['route-main', 'route-casing', 'route-alt'].forEach(id => {
    if (map.getLayer(id)) map.removeLayer(id);
  });
  ['route-src', 'route-alt-src'].forEach(id => {
    if (map.getSource(id)) map.removeSource(id);
  });
  dirState.markers.forEach(m => m.remove());
  dirState.markers = [];
}

async function routeNow() {
  try {
    dirOut.innerHTML = '<div class="loading-note"><span class="spin"></span>&nbsp; Finding the best route…</div>';

    if (!dirState.from && dirFromInput.value.trim()) dirState.from = await geocodeOne(dirFromInput.value.trim());
    if (!dirState.to && dirToInput.value.trim()) dirState.to = await geocodeOne(dirToInput.value.trim());
    if (!dirState.from || !dirState.to) {
      dirOut.innerHTML = '<div class="loading-note">Could not resolve ' + (!dirState.from ? 'the starting point' : 'the destination') + '. Try a more specific name, or use ⌖ to pick on the map.</div>';
      return;
    }

    const a = dirState.from, b = dirState.to;
    const url = 'https://router.project-osrm.org/route/v1/driving/' +
      a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat +
      '?overview=full&geometries=geojson&steps=true&alternatives=true';
    const res = await fetch(url);
    if (!res.ok) throw new Error('routing http ' + res.status);
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route found');

    clearRoute();
    const main = data.routes[0];
    const alts = data.routes.slice(1);

    if (alts.length) {
      map.addSource('route-alt-src', { type: 'geojson', data: {
        type: 'FeatureCollection',
        features: alts.map(r => ({ type: 'Feature', properties: {}, geometry: r.geometry }))
      }});
      map.addLayer({
        id: 'route-alt', type: 'line', source: 'route-alt-src',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#9AA0AC', 'line-width': 4, 'line-opacity': 0.55, 'line-dasharray': [1.4, 1.6] }
      });
    }
    map.addSource('route-src', { type: 'geojson', data: { type: 'Feature', properties: {}, geometry: main.geometry } });
    map.addLayer({
      id: 'route-casing', type: 'line', source: 'route-src',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#0B0E14', 'line-width': 9, 'line-opacity': 0.7 }
    });
    map.addLayer({
      id: 'route-main', type: 'line', source: 'route-src',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#3ddc84', 'line-width': 5 }
    });

    dirState.markers = [
      new maplibregl.Marker({ color: '#3ddc84' }).setLngLat([a.lng, a.lat]).addTo(map),
      new maplibregl.Marker({ color: '#FF7A1A' }).setLngLat([b.lng, b.lat]).addTo(map)
    ];

    const coords = main.geometry.coordinates;
    const bounds = coords.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
    map.fitBounds(bounds, { padding: { top: 90, bottom: 100, left: window.innerWidth > 640 ? 400 : 40, right: 60 }, pitch: 0, duration: REDUCED ? 0 : 1800 });

    let html = '<div class="route-sum"><span class="big">' + fmtDur(main.duration) + '</span>' +
      '<span class="km">' + fmtDist(main.distance) + ' · drive</span></div>';
    if (alts.length) html += '<div class="loading-note" style="margin-top:0">+' + alts.length + ' alternative route' + (alts.length > 1 ? 's' : '') + ' shown dashed on the map</div>';
    html += '<div class="steps">';
    (main.legs[0].steps || []).forEach(s => {
      html += '<div class="step"><span class="ic">' + stepIcon(s) + '</span>' +
        '<span class="tx">' + stepText(s) + '</span>' +
        '<span class="dist">' + (s.distance > 0 ? fmtDist(s.distance) : '') + '</span></div>';
    });
    html += '</div>';
    dirOut.innerHTML = html;
  } catch (e) {
    console.warn('routing failed', e);
    dirOut.innerHTML = '<div class="loading-note">Routing failed — the free routing server may be busy. Try again in a moment.</div>';
  }
}

/* ---------- Controls ---------- */
const btnSat = document.getElementById('btnSat');
btnSat.addEventListener('click', () => {
  satOn = !satOn;
  btnSat.classList.toggle('active', satOn);
  if (map.getLayer('sat-layer')) {
    map.setLayoutProperty('sat-layer', 'visibility', satOn ? 'visible' : 'none');
  }
  if (map.getLayer('hillshade')) {
    map.setLayoutProperty('hillshade', 'visibility', satOn ? 'none' : 'visible');
  }
  toast(satOn ? 'Satellite imagery on' : 'Street map');
});

const btn3d = document.getElementById('btn3d');
btn3d.addEventListener('click', () => {
  const flat = map.getPitch() > 5;
  btn3d.classList.toggle('active', !flat);
  if (REDUCED) map.jumpTo({ pitch: flat ? 0 : 60 });
  else map.easeTo({ pitch: flat ? 0 : 60, duration: 900 });
});

const btnTerrain = document.getElementById('btnTerrain');
btnTerrain.addEventListener('click', () => {
  terrainOn = !terrainOn;
  btnTerrain.classList.toggle('active', terrainOn);
  map.setTerrain(terrainOn ? { source: 'dem', exaggeration: 1.35 } : null);
  toast(terrainOn ? 'Terrain on' : 'Terrain off');
});

document.getElementById('btnNorth').addEventListener('click', () => {
  if (REDUCED) map.jumpTo({ bearing: 0 });
  else map.easeTo({ bearing: 0, duration: 700 });
});

document.getElementById('btnLocate').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Geolocation not supported'); return; }
  toast('Locating…');
  navigator.geolocation.getCurrentPosition(
    pos => flyTo(pos.coords.longitude, pos.coords.latitude, 15, 55),
    () => toast('Location permission denied'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

/* ---------- HUD ---------- */
const hLat = document.getElementById('hLat'), hLng = document.getElementById('hLng'),
      hZ = document.getElementById('hZ'), hP = document.getElementById('hP'),
      hE = document.getElementById('hE');
let hudLast = 0;
map.on('move', () => {
  const now = performance.now();
  if (now - hudLast < 150) return; // text + elevation lookups off the frame path
  hudLast = now;
  const c = map.getCenter();
  hLat.textContent = c.lat.toFixed(3);
  hLng.textContent = c.lng.toFixed(3);
  hZ.textContent = map.getZoom().toFixed(1);
  hP.textContent = Math.round(map.getPitch()) + '°';
  try {
    const el = map.queryTerrainElevation(c);
    hE.textContent = (el !== null && el !== undefined) ? Math.round(el) + 'm' : '—';
  } catch (e) { hE.textContent = '—'; }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

} /* end initApp */
</script>
</body>
</html>
